# Joint configuration for joint_state_publisher_gui

joint_state_publisher:
  ros__parameters:
    # Joint names and default positions
    zeros:
      base: 0.0
      elbow: 0.0
      gripper: 0.0
      shoulder: 0.0
      wrist_pitch: 0.0
      wrist_roll: 0.0

    # Joints to publish
    source_list:
      - base
      - elbow
      - gripper
      - shoulder
      - wrist_pitch
      - wrist_roll